services:
  whisper-asr-webservice:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      - ASR_MODEL=large-v3
      - ASR_ENGINE=whisperx
      - ASR_DEVICE=cpu
      - ASR_QUANTIZATION=int8
      # Каждый воркер держит СВОЮ копию моделей: полностью загруженный ~4,7 ГБ.
      # На 6 воркерах это ~28 ГБ, и своп на сервере уходил в ноль, вытесняя
      # MySQL Bitrix. 4 = ASR_MAX_PARALLEL_FILES у Sales Evaluator, очереди нет.
      - UVICORN_WORKERS=4
      # Cap the torch/ctranslate2 thread pools: 18 cores across 4 workers.
      # Without this each worker spawned one thread per core, they fought over
      # the CPU, and every thread claimed its OWN malloc arena, that is, its
      # own reserve of memory never given back.
      - OMP_NUM_THREADS=4
      # Keep malloc down to two arenas and release anything above 128 MB back
      # to the kernel. Until now freed memory stayed in the glibc arenas: over
      # ten days a worker reached 8.4 GB RSS on a 4.7 GB working set.
      - MALLOC_ARENA_MAX=2
      - MALLOC_TRIM_THRESHOLD_=134217728
      # Unload the models after half an hour of idleness, which frees ~5 GB
      # per worker overnight and at weekends. The cost: the first request of
      # the morning waits ~20-30s for them to load again.
      - MODEL_IDLE_TIMEOUT=1800
      # Restart a worker every 50+-10 files. It leaves between files, finishing
      # the transcription in hand first; the supervisor starts a fresh one
      # within 0.5s.
      - MAX_REQUESTS_PER_WORKER=50
      - MAX_REQUESTS_JITTER=10
    ports:
      # Порт больше НЕ слушает публичный IP. Только:
      #   172.17.0.1 — шлюз docker0, сюда ходит Sales Evaluator
      #                (у него ASR_API_URL=http://host.docker.internal:9000,
      #                 а host.docker.internal резолвится именно в 172.17.0.1)
      #   127.0.0.1  — отладка с самого сервера
      # Внешний доступ идёт через asr-gateway на :9443 с API-ключом.
      - "172.17.0.1:9000:9000"
      - "127.0.0.1:9000:9000"
    volumes:
      - ./app:/app/app
      - cache-whisper:/root/.cache
    # Memory ceiling. Four fresh workers take ~19 GB; 28 leaves room for peaks
    # while stopping the container from growing back to the 36 GB at which the
    # kernel picked the Bitrix mysqld as its victim. On hitting the limit the
    # kernel kills a worker inside the container, and the master survives to
    # start a replacement.
    mem_limit: 28g
    # Equal to mem_limit, which denies the container swap altogether. Until now
    # whisper held 3.8 GB of the 6.8 GB in use — the very swap MySQL relies on
    # during its peaks.
    memswap_limit: 28g
    restart: unless-stopped

  # Внешний вход: HTTPS + API-ключ. Внутрь стека ходит по docker-сети,
  # поэтому опубликованный порт whisper ему не нужен.
  asr-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - whisper-asr-webservice
    environment:
      # Ключ берётся из .env; envsubst подставит его в конфиг при старте.
      - ASR_API_KEY=${ASR_API_KEY:?ASR_API_KEY не задан в .env}
      # Подставлять только эту переменную, конфиг nginx не трогать.
      - NGINX_ENVSUBST_FILTER=^ASR_API_KEY$$
    ports:
      - "9443:443"
    volumes:
      - ./nginx/asr.conf.template:/etc/nginx/templates/asr.conf.template:ro
      # Существующий сертификат Let's Encrypt для app.24print.ua.
      # Только чтение; certbot на хосте продолжает обновлять его как обычно.
      - /etc/letsencrypt:/etc/letsencrypt:ro

volumes:
  cache-whisper:
