services:
  whisper-asr-webservice-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    env_file:
      - .env      
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      - ASR_MODEL=base
    ports:
      # Не публикуем на внешний IP — см. комментарий в docker-compose.yml.
      # Внешний доступ только через asr-gateway с API-ключом.
      - "172.17.0.1:9000:9000"
      - "127.0.0.1:9000:9000"
    volumes:
      - ./app:/app/app
      - cache-whisper:/root/.cache

volumes:
  cache-whisper:
